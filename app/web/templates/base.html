<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Playlist Forge{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    .conf-HIGH { color: #2e7d32; } .conf-MEDIUM { color: #b26a00; } .conf-LOW { color: #c62828; font-weight: 600; } .conf-USER { color: #1565c0; } .conf-ASSUMED { color: #6d6d6d; }
    table td, table th { font-size: 0.9rem; }
    footer { margin-top: 3rem; font-size: 0.8rem; opacity: 0.8; }
    .profile header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 0.75rem; }
    .profile .share { font-weight: 700; margin-left: auto; }
    .profile .trend.up { color: #2e7d32; } .profile .trend.down { color: #8a6d00; }
    .sharebar { flex-basis: 100%; height: 6px; background: var(--pico-muted-border-color, #ddd); border-radius: 3px; overflow: hidden; }
    .sharebar span { display: block; height: 100%; background: var(--pico-primary, #1095c1); }
    .fit { display: inline-flex; gap: 2px; vertical-align: middle; }
    .fit i { display: inline-block; width: 7px; height: 14px; border-radius: 2px; background: var(--pico-muted-border-color, #ddd); }
    .fit i.on { background: var(--pico-primary, #1095c1); }
    table.recs td { vertical-align: top; }
    .playlist header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
    .playlist .actions { margin-left: auto; display: flex; gap: 0.5rem; }
    .playlist .actions button, .playlist .actions a { margin: 0; padding: 0.25rem 0.75rem; font-size: 0.85rem; width: auto; }
    .playlist textarea { font-family: monospace; font-size: 0.85rem; margin-bottom: 0.5rem; }
    .plsize { display: flex; flex-wrap: wrap; align-items: end; gap: 0.5rem 1rem; margin-bottom: 1rem; }
    .plsize label { margin: 0; } .plsize input { width: 6rem; margin: 0; }
    .plsize button { width: auto; margin: 0; padding: 0.4rem 1rem; }
    .vote { display: inline-flex; gap: 2px; }
    .vote button { width: 1.8rem; height: 1.8rem; padding: 0; margin: 0; line-height: 1; font-size: 1rem; }
    .vote button.on { background: var(--pico-primary, #1095c1); color: #fff; border-color: var(--pico-primary, #1095c1); }
  </style>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/"><strong>Playlist Forge</strong></a></li></ul>
      <ul><li><a href="/upload">Start</a></li></ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    Your files are processed and deleted after 24 hours. Playlist Forge never sees your Spotify login.
    Not affiliated with Spotify.
  </footer>
</body>
</html>
